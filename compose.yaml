services:
  syncplay:
    build: .
    image: syncplay-history
    container_name: syncplay-history
    restart: unless-stopped
    ports:
      # loopback only: the server is meant to be reached through a same-host
      # reverse proxy (see DOCKER.md, "Behind a reverse proxy")
      - "127.0.0.1:12346:12346"
      # admin web app: published on the host's loopback only (expose through
      # the same reverse proxy, or reach it via ssh -L 12347:127.0.0.1:12347).
      # The container itself binds 0.0.0.0 (entrypoint.sh --host 0.0.0.0)
      # because Docker port mapping only reaches the container network IP.
      - "127.0.0.1:12347:12347"
    environment:
      # Internal port the syncplay server listens on (the proxy forwards to it).
      SYNCPLAY_PORT: "12345"
      # Port clients connect to (the proxy). If changed, update the ports
      # mapping above as well.
      PROXY_PORT: "12346"
      # Admin web app port (loopback only).
      ADMIN_PORT: "12347"
      # Optional bearer token for the admin API. Unset = open access.
      # ADMIN_TOKEN: "change-me"
      # Backend database for rooms + watch history (non-secret parts). Leave
      # DB_HOST empty to use the built-in SQLite default
      # (sqlite:////data/syncplay.sqlite). DB_PASS lives in .secrets.env, NOT here.
      DB_HOST: "10.8.0.11"
      DB_PORT: "5432"
      DB_USER: "syncplay_user"
      DB_NAME: "syncplay_history"
      # Syncplay server options (all optional; unset/empty = server default).
      SYNCPLAY_ISOLATE_ROOMS: "false"
      SYNCPLAY_DISABLE_READY: "true"
      SYNCPLAY_DISABLE_CHAT: "false"
      SYNCPLAY_IPV4_ONLY: "false"
      SYNCPLAY_IPV6_ONLY: "false"
      # SYNCPLAY_MOTD_FILE: /app/motd.txt
      # One-time seed of permanent rooms from the legacy text file (only read
      # when the permanent_rooms table is empty; the DB is the source of truth).
      # SYNCPLAY_PERMANENT_ROOMS_FILE: /data/permanent_rooms.txt
      # SYNCPLAY_MAX_CHAT_MESSAGE_LENGTH: "150"
      # SYNCPLAY_MAX_USERNAME_LENGTH: "16"
      # SYNCPLAY_STATS_DB_FILE: /data/stats.sqlite
      # SYNCPLAY_TLS_PATH: /app/tls
      # SYNCPLAY_INTERFACE_IPV4: 0.0.0.0
      # SYNCPLAY_INTERFACE_IPV6: ::
    volumes:
      - ./data:/data
      # ,z: SELinux label so the container can read the host file (Fedora)
      - ./.secrets.env:/app/.secrets.env:ro,z
    networks:
      - default
      - proxy-tier

networks:
  default:
  proxy-tier:
    external: true
