services:
  syncplay:
    build: .
    image: syncplay-history
    container_name: syncplay-history
    ports:
      - "12346:12346"
    environment:
      # Internal port the syncplay server listens on (the proxy forwards to it).
      SYNCPLAY_PORT: "12345"
      # Port clients connect to (the proxy). If changed, update the ports
      # mapping above as well.
      PROXY_PORT: "12346"
      # Watch-history database (non-secret parts). Leave DB_HOST empty to use
      # the built-in SQLite default (sqlite:////data/history.sqlite).
      # DB_PASS lives in .secrets.env, NOT here.
      DB_HOST: "10.8.0.11"
      DB_PORT: "5432"
      DB_USER: "syncplay_user"
      DB_NAME: "syncplay_history"
      # Syncplay server options (all optional; unset/empty = server default).
      SYNCPLAY_ISOLATE_ROOMS: "false"
      SYNCPLAY_DISABLE_READY: "false"
      SYNCPLAY_DISABLE_CHAT: "false"
      SYNCPLAY_IPV4_ONLY: "false"
      SYNCPLAY_IPV6_ONLY: "false"
      # SYNCPLAY_MOTD_FILE: /app/motd.txt
      SYNCPLAY_ROOMS_DB_FILE: /data/rooms.sqlite
      SYNCPLAY_PERMANENT_ROOMS_FILE: /data/permanent_rooms.txt
      # SYNCPLAY_MAX_CHAT_MESSAGE_LENGTH: "150"
      # SYNCPLAY_MAX_USERNAME_LENGTH: "16"
      # SYNCPLAY_STATS_DB_FILE: /data/stats.sqlite
      # SYNCPLAY_TLS_PATH: /app/tls
      # SYNCPLAY_INTERFACE_IPV4: 0.0.0.0
      # SYNCPLAY_INTERFACE_IPV6: ::
    volumes:
      - ./data:/data
      # ,z: SELinux label so the container can read the host file (Fedora)
      - ./.secrets.env:/app/.secrets.env:ro,z
